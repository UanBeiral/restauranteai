# app/deploy/stack.yml
version: "3.9"

networks:
  web:
    name: web

services:
  backend:
    build:
      context: ../bread-meat-delivery-backend
      dockerfile: Dockerfile
    image: restauranteai-backend:latest
    environment:
      # Ajuste no Portainer (não comitar segredos)
      ACCESS_CODE: ${ACCESS_CODE}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.seudominio.com}
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../bread-meat-delivery-frontend
      dockerfile: Dockerfile
      args:
        - API_BASE_URL=http://backend:8000
    image: restauranteai-frontend:latest
    environment:
      NODE_ENV: production
      # Se quiser forçar via env pública (não é necessário com rewrite):
      # NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
